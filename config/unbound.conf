# /etc/unbound/unbound.conf - DayShield DNS resolver configuration.
# IPv4-first, hardened recursive resolver for firewall/LAN use.
#
# IMPORTANT: dayshield-core is the source of truth for every *dynamic* setting
# (listen interface, access-control, DNSSEC trust anchor, module-config, cache
# TTLs, prefetch, forwarders, DoT, local records, ...). Those are emitted into
# the managed include at the bottom of this file, which is pulled in from inside
# this single server: clause.
#
# Because the fragment lives in the same server: clause, this base file MUST NOT
# repeat any *accumulating* directive the fragment emits - chiefly `interface`,
# `access-control`, and `auto-trust-anchor-file`. Those accumulate rather than
# override, so listing them in both places makes unbound fail to start (e.g.
# "trust anchor for '.' presented twice", or a duplicate 0.0.0.0:53 bind that
# unbound-checkconf does not catch). Scalar directives (do-ip*, etc.) are
# last-wins and may safely appear here as bootstrap defaults for the brief
# window before the DNS engine rewrites the fragment on first boot.

server:
    ###########################################################################
    # Process
    ###########################################################################
    pidfile: "/run/unbound/unbound.pid"

    ###########################################################################
    # Protocol defaults (IPv4-only at boot; dayshield-core toggles do-ip6 once
    # it writes the managed fragment). These are scalar last-wins directives, so
    # the fragment's values override whatever is set here.
    ###########################################################################
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    ###########################################################################
    # Hardening not managed by dayshield-core
    ###########################################################################
    harden-below-nxdomain: yes

    # Explicitly pinned off for compatibility with known-bad environments.
    qname-minimisation: no
    aggressive-nsec: no

    ###########################################################################
    # Root hints (required for recursive mode)
    ###########################################################################
    root-hints: "/usr/share/dns/root.hints"

    ###########################################################################
    # Privacy & response tuning not managed by dayshield-core
    ###########################################################################
    minimal-responses: yes
    edns-buffer-size: 1232

    ###########################################################################
    # Cache sizing (TTL bounds and prefetch are managed by dayshield-core)
    ###########################################################################
    rrset-cache-size: 256m
    msg-cache-size: 128m
    prefetch-key: yes

    ###########################################################################
    # Private address protection
    ###########################################################################
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 100.64.0.0/10

    ###########################################################################
    # Block reverse lookups for private ranges
    ###########################################################################
    # 10.0.0.0/8
    local-zone: "10.in-addr.arpa." nodefault

    # 172.16.0.0/12 (172.16–172.31)
    local-zone: "16.172.in-addr.arpa." nodefault
    local-zone: "17.172.in-addr.arpa." nodefault
    local-zone: "18.172.in-addr.arpa." nodefault
    local-zone: "19.172.in-addr.arpa." nodefault
    local-zone: "20.172.in-addr.arpa." nodefault
    local-zone: "21.172.in-addr.arpa." nodefault
    local-zone: "22.172.in-addr.arpa." nodefault
    local-zone: "23.172.in-addr.arpa." nodefault
    local-zone: "24.172.in-addr.arpa." nodefault
    local-zone: "25.172.in-addr.arpa." nodefault
    local-zone: "26.172.in-addr.arpa." nodefault
    local-zone: "27.172.in-addr.arpa." nodefault
    local-zone: "28.172.in-addr.arpa." nodefault
    local-zone: "29.172.in-addr.arpa." nodefault
    local-zone: "30.172.in-addr.arpa." nodefault
    local-zone: "31.172.in-addr.arpa." nodefault

    # 192.168.0.0/16
    local-zone: "168.192.in-addr.arpa." nodefault

    # Optional: CGNAT 100.64.0.0/10 reverse blocking
    # Uncomment if you want full parity with private-address rules
    # local-zone: "64.100.in-addr.arpa." nodefault
    # local-zone: "65.100.in-addr.arpa." nodefault
    # ...
    # local-zone: "127.100.in-addr.arpa." nodefault

    ###########################################################################
    # Logging
    ###########################################################################
    log-queries: no

    ###########################################################################
    # DayShield-managed dynamic settings.
    #
    # dayshield-core owns the listen interface/port, IPv4/IPv6, access-control,
    # DNSSEC trust anchor + module-config, cache TTL bounds, prefetch,
    # forwarders, DoT, and local records. They are written here so they survive
    # every rootfs A/B update. Do NOT duplicate any of those directives above:
    # interface/anchor/etc. listed twice in one server: clause stop unbound from
    # starting. A placeholder empty file is shipped so first boot and config
    # validation succeed before the DNS engine rewrites it.
    ###########################################################################
    include: "/var/lib/dayshield/unbound/dayshield.conf"
